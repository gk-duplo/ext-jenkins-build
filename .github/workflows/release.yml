# Publishes each extension in this repo as a GitHub Release on push to main.
#
# For every extensions/<name>/ it builds the bundle and, ONLY when manifest.version is new (its
# <name>-v<version> tag doesn't exist yet), cuts a GitHub Release with extension.zip attached. Bumping
# manifest.version is therefore how you publish a new version to the extension library.
#
# This file ships with the dev-kit. After scripts/init-project.sh makes the repo yours, set these repo secrets
# (same as Extension CI): DUPLO_HOST + DUPLO_TOKEN. The build fetches the host SDK feed from DUPLO_HOST, so it
# must be reachable from CI (a public DuploCloud, not localhost).
#
# NOTE: the hot-load/deploy step is intentionally COMMENTED OUT (see below). We publish releases but do not
# auto-install onto the portal, so the install-from-registry flow stays testable end to end. Uncomment the
# "Deploy" step to auto-hot-load on merge.
name: Extension Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # required to create GitHub Releases

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DUPLO_TARGET: remote
      DUPLO_HOST: ${{ secrets.DUPLO_HOST }}
      DUPLO_TOKEN: ${{ secrets.DUPLO_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover extensions
        id: guard
        run: |
          shopt -s nullglob
          dirs=(extensions/*/manifest.json extension/*/manifest.json extension/manifest.json)
          if [ ${#dirs[@]} -gt 0 ]; then echo "build=true" >> "$GITHUB_OUTPUT"
          else echo "build=false" >> "$GITHUB_OUTPUT"; echo "::notice::No extensions/*/manifest.json — nothing to release."; fi

      - uses: actions/setup-dotnet@v6
        if: steps.guard.outputs.build == 'true'
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.build == 'true'
        with:
          node-version: '22'

      - name: Build all extensions
        if: steps.guard.outputs.build == 'true'
        run: ./scripts/build-all.sh

      # Deploy (hot-load) is intentionally disabled so the install-from-registry flow can be tested end to end.
      # Uncomment to auto-install the built bundles onto the platform on merge to main.
      # - name: Deploy all extensions (hot-load to DuploCloud)
      #   if: steps.guard.outputs.build == 'true'
      #   run: ./scripts/deploy-all.sh

      - name: Publish GitHub releases (only for new manifest.version)
        if: steps.guard.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          published=0; skipped=0
          for m in extensions/*/manifest.json extension/*/manifest.json extension/manifest.json; do
            [ -f "$m" ] || continue
            dir="$(dirname "$m")"
            zip="$dir/dist/extension.zip"
            if [ ! -f "$zip" ]; then
              echo "::warning::$dir — no dist/extension.zip (build produced nothing); skipping."
              continue
            fi
            name="$(jq -r '.name // (.id)' "$m")"
            version="$(jq -r '.version' "$m")"
            slug="$(basename "$dir")"
            tag="${slug}-v${version}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "==> $tag already released — skipping (bump manifest.version to publish a new one)."
              skipped=$((skipped+1))
              continue
            fi
            echo "==> Publishing release $tag ($name $version)"
            gh release create "$tag" "$zip" \
              --title "$name $version" \
              --notes "Automated release of $name v$version from $slug (extension.zip attached)."
            published=$((published+1))
          done
          echo "==> Released $published, skipped $skipped (already-published versions)."
