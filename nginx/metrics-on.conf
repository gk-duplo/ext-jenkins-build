# Usage metrics ON — opted in. Mounted at /etc/nginx/metrics.conf by docker-compose when
# METRICS_CONF=metrics-on.conf, and included by default.conf.
#
# The UI image bakes the Mixpanel key into its Angular bundle at build time (angular.json swaps in
# environment.prod.ts), so there is nothing to configure at runtime — we rewrite the served JS.
# Images built from duplo-ui master carry an EMPTY key, so opting in means inserting it here.
# Against an image that already carries the key this is a no-op (the empty-string pattern misses).
sub_filter_types application/javascript text/javascript;
sub_filter_once off;
sub_filter 'mixpanelToken:""' 'mixpanelToken:"24cdbeb56cb7efdd61a77ca27481af15"';
