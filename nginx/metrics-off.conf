# Usage metrics OFF — opted out. Mounted at /etc/nginx/metrics.conf by docker-compose when
# METRICS_CONF=metrics-off.conf, and included by default.conf.
#
# Removes the baked-in Mixpanel key from the served bundle, so MixpanelService.initMixpanel()
# sees an empty token and never calls mixpanel.init(). Nothing is posted, and the key does not
# reach the browser at all. A no-op against an image whose key is already empty.
#
# The literal below is pinned to the key in the current UI_TAG. If duplo-ui ever rotates the token,
# a UI_TAG bump would silently restore tracking for opted-out users. Re-verify when bumping UI_TAG:
#   docker run --rm --entrypoint sh <ui-image> -c 'grep -roh "mixpanelToken:\"[^\"]*\"" /usr/share/nginx/html | sort -u'
sub_filter_types application/javascript text/javascript;
sub_filter_once off;
sub_filter '"24cdbeb56cb7efdd61a77ca27481af15"' '""';
